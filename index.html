<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitLab Migration Tool - Enhanced</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* CSS styles remain identical to your provided file */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6C63FF; --primary-dark: #5A52D5; --primary-glow: rgba(108, 99, 255, 0.4);
            --success: #00D9A3; --success-dark: #00B887; --success-glow: rgba(0, 217, 163, 0.4);
            --danger: #FF6B6B; --danger-dark: #FF5252; --danger-glow: rgba(255, 107, 107, 0.4);
            --warning: #FFB800; --warning-glow: rgba(255, 184, 0, 0.4);
            --bg-dark: #0F1419; --bg-card: #1A1F2E; --bg-card-hover: #252B3B;
            --text: #FFFFFF; --text-muted: #8B92A8;
            --border: rgba(255, 255, 255, 0.05); --border-bright: rgba(255, 255, 255, 0.1);
        }
        [data-theme="light"] {
            --bg-dark: #F5F7FA; --bg-card: #FFFFFF; --bg-card-hover: #F0F2F5;
            --text: #1A202C; --text-muted: #64748B;
            --border: rgba(0, 0, 0, 0.08); --border-bright: rgba(0, 0, 0, 0.12);
        }
        body { transition: background-color 0.3s ease, color 0.3s ease; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg-dark); color: var(--text); overflow-y: auto; line-height: 1.6; }
        .header { background: rgba(26, 31, 46, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 20px 30px; border-bottom: 1px solid var(--border-bright); position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.3), 0 0 40px var(--primary-glow); }
        .header h1 { font-size: 1.6rem; font-weight: 700; background: linear-gradient(135deg, var(--primary) 0%, var(--success) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .header-controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .branch-input { background: var(--bg-card); border: 1px solid var(--border-bright); color: var(--text); padding: 8px 12px; border-radius: 5px; width: 120px; font-family: 'JetBrains Mono', monospace; }
        .btn { padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; margin: 5px; border: 1px solid var(--border); }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; }
        .btn-success { background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%); color: white; }
        .btn-danger { background: linear-gradient(135deg, var(--danger) 0%, var(--danger-dark) 100%); color: white; }
        .load-config-btn { background: linear-gradient(135deg, var(--primary) 0%, var(--success) 100%); color: white; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .main-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; padding: 20px; min-height: calc(100vh - 200px); }
        .panel { background: rgba(26, 31, 46, 0.6); backdrop-filter: blur(12px); border-radius: 12px; display: flex; flex-direction: column; border: 1px solid var(--border-bright); }
        .panel-header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 20px; border-bottom: 1px solid var(--border-bright); font-weight: 700; color: white; text-align: center; }
        .panel-content { flex: 1; padding: 20px; overflow-y: auto; }
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
        .modal.show { display: block; }
        .modal-content { background: rgba(26, 31, 46, 0.95); margin: 2% auto; width: 95%; max-width: 1400px; border-radius: 16px; max-height: 90vh; display: flex; flex-direction: column; border: 1px solid var(--border-bright); }
        .modal-header { padding: 20px 25px; border-bottom: 1px solid var(--border-bright); display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); }
        .modal-body { padding: 25px; overflow-y: auto; flex: 1; }
        /* Add other necessary styles from your original file here */
        .toast { position: fixed; top: 90px; right: 20px; background: #333; color: white; padding: 15px; border-radius: 8px; z-index: 9999; display: none; }
        .toast.show { display: block; }
        .checkbox-item { display: flex; align-items: center; padding: 5px; }
        .logs { background: #111; padding: 10px; margin-top: 10px; border-radius: 5px; font-family: monospace; max-height: 200px; overflow-y: auto; display: none; }
        .logs.show { display: block; }
        .log-entry { margin: 2px 0; }
        .log-info { color: #aaa; } .log-success { color: #4caf50; } .log-error { color: #f44336; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>🚀 GitLab Migration Tool - Enhanced</h1>
            <div class="header-controls">
                <input type="text" id="branch-number" class="branch-input" value="12938" placeholder="Branch #">
                <button class="load-config-btn" onclick="loadConfiguration()">⚙️ Load Configuration</button>
            </div>
        </div>
    </div>
    
    <div class="main-container">
        <div class="panel">
            <div class="panel-header">📋 Full Migration</div>
            <div class="panel-content">
                <div id="projects-full"></div>
                <div style="margin-top: 20px;">
                    <div><input type="checkbox" id="file-pom" checked> POM.xml</div>
                    <div><input type="checkbox" id="file-ci" checked> .gitlab-ci.yml</div>
                    <div><input type="checkbox" id="file-eb" checked> Config.yml</div>
                </div>
                <div style="margin-top: 15px;">
                    <button class="btn btn-primary" onclick="previewFullMigration()">👁️ Preview</button>
                    <button class="btn btn-danger" onclick="createMRFullMigration()" id="mr-full-btn" disabled>🔀 Create MR</button>
                    <button class="btn btn-success" onclick="createTagAndDeploy()" id="tag-deploy-btn" disabled>🚀 Tag & Deploy</button>
                </div>
                <div id="full-logs" class="logs"></div>
            </div>
        </div>
        
        <div class="panel">
            <div class="panel-header">🏷️ Tag & Deploy</div>
            <div class="panel-content">
                <div id="projects-deploy"></div>
                <button class="btn btn-primary" onclick="loadTags()" id="load-tags-btn" style="margin-top:10px;">📋 Load Tags</button>
                <div id="tags-deploy" style="margin-top: 10px;"></div>
                <button class="btn btn-danger" onclick="startDeployment()" id="deploy-btn" disabled style="margin-top:10px;">🚀 Deploy</button>
                <div id="deploy-logs" class="logs"></div>
            </div>
        </div>
        
        <div class="panel">
            <div class="panel-header">🔀 Bulk Operations</div>
            <div class="panel-content">
                <div id="projects-bulk"></div>
                <button class="btn btn-success" onclick="createBulkMRs()" style="margin-top:10px;">🚀 Create MRs</button>
                <div id="bulk-logs" class="logs"></div>
            </div>
        </div>
    </div>
    
    <div id="diff-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="color:white">📄 Preview Changes</h2>
                <div>
                    <button class="btn btn-success" id="modal-commit-btn" onclick="commitFromModal()">✅ Commit Changes</button>
                    <span style="color:white; cursor:pointer; font-size:24px;" onclick="closeDiffModal()">&times;</span>
                </div>
            </div>
            <div class="modal-body" id="modal-diff-content"></div>
        </div>
    </div>

    <script>
        let projects = [];
        let previewData = [];
        let lastChoices = []; // Store choices for commit
        let selectedDeployProject = null;
        
        async function loadConfiguration() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                if(data.success) {
                    projects = data.projects;
                    renderProjects();
                    showToast('Config Loaded', 'Success', 'success');
                }
            } catch(e) { showToast('Error', e.message, 'error'); }
        }
        
        function renderProjects() {
            const full = document.getElementById('projects-full');
            const bulk = document.getElementById('projects-bulk');
            const deploy = document.getElementById('projects-deploy');
            full.innerHTML = bulk.innerHTML = deploy.innerHTML = '';
            
            projects.forEach(p => {
                full.innerHTML += `<div class="checkbox-item"><input type="checkbox" id="full-project-${p.id}" value="${p.id}"> ${p.name}</div>`;
                bulk.innerHTML += `<div class="checkbox-item"><input type="checkbox" id="bulk-project-${p.id}" value="${p.id}"> ${p.name}</div>`;
                deploy.innerHTML += `<div class="checkbox-item"><input type="radio" name="deploy-p" value="${p.id}" onchange="selectDeployProject(${p.id})"> ${p.name}</div>`;
            });
        }
        
        function getSelected(prefix) {
            return Array.from(document.querySelectorAll(`input[id^="${prefix}-"]:checked`)).map(c => parseInt(c.value));
        }
        
        async function previewFullMigration() {
            const pids = getSelected('full-project');
            if(!pids.length) return showToast('Error', 'Select projects', 'error');
            
            const choices = [];
            if(document.getElementById('file-pom').checked) choices.push('1');
            if(document.getElementById('file-ci').checked) choices.push('2');
            if(document.getElementById('file-eb').checked) choices.push('3');
            lastChoices = choices; // Save for commit
            
            let allActions = [];
            for(const pid of pids) {
                try {
                    const res = await fetch(`/api/projects/${pid}/preview`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ choices, branch: 'develop' })
                    });
                    const data = await res.json();
                    if(data.success && data.actions.length) {
                        allActions.push({ project: projects.find(p=>p.id===pid).name, projectId: pid, actions: data.actions });
                    }
                } catch(e) { console.error(e); }
            }
            
            if(allActions.length) {
                previewData = allActions;
                renderPreview(allActions);
            } else {
                showToast('Info', 'No changes detected', 'warning');
            }
        }
        
        function renderPreview(data) {
            const content = document.getElementById('modal-diff-content');
            let html = '';
            data.forEach(item => {
                html += `<h3>${item.project}</h3>`;
                item.actions.forEach(act => {
                    html += `<div style="background:#222; padding:10px; margin:5px 0; border-radius:5px;">
                        <strong>${act.file_path}</strong>
                        <pre style="color:#ddd; overflow-x:auto;">${escapeHtml(act.diff || 'No text diff')}</pre>
                    </div>`;
                });
            });
            content.innerHTML = html;
            document.getElementById('diff-modal').classList.add('show');
        }
        
        async function commitFromModal() {
            const btn = document.getElementById('modal-commit-btn');
            btn.disabled = true;
            btn.innerText = "Committing...";
            
            const projectIds = previewData.map(p => p.projectId);
            const branchNum = document.getElementById('branch-number').value;
            
            try {
                // CHANGED: Use /api/bulk-commit instead of /api/commit
                const res = await fetch('/api/bulk-commit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        project_ids: projectIds, 
                        choices: lastChoices, 
                        branch_num: branchNum 
                    })
                });
                const data = await res.json();
                if(data.success) {
                    showToast('Success', 'Commit initiated', 'success');
                    closeDiffModal();
                    // Enable next buttons
                    document.getElementById('mr-full-btn').disabled = false;
                    document.getElementById('tag-deploy-btn').disabled = false;
                    // Monitor one task to show logs
                    monitorTask(data.task_id, 'full');
                } else {
                    showToast('Error', data.error, 'error');
                }
            } catch(e) { showToast('Error', e.message, 'error'); }
            btn.disabled = false;
            btn.innerText = "✅ Commit Changes";
        }
        
        async function createMRFullMigration() {
            // CHANGED: Use /api/bulk-mr instead of /api/mr
            const pids = getSelected('full-project');
            const branchNum = document.getElementById('branch-number').value;
            
            try {
                const res = await fetch('/api/bulk-mr', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ project_ids: pids, branch_num: branchNum })
                });
                const data = await res.json();
                if(data.success) {
                    showToast('Success', 'MRs initiated', 'success');
                    monitorTask(data.task_id, 'full');
                }
            } catch(e) { console.error(e); }
        }

        async function createBulkMRs() {
            const pids = getSelected('bulk-project');
            const branchNum = document.getElementById('branch-number').value;
            
            try {
                const res = await fetch('/api/bulk-mr', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ project_ids: pids, branch_num: branchNum })
                });
                const data = await res.json();
                if(data.success) monitorTask(data.task_id, 'bulk');
            } catch(e) { console.error(e); }
        }
        
        function selectDeployProject(pid) {
            selectedDeployProject = pid;
        }
        
        async function loadTags() {
            if(!selectedDeployProject) return;
            try {
                const res = await fetch(`/api/projects/${selectedDeployProject}/tags`);
                const data = await res.json();
                if(data.success) {
                    const container = document.getElementById('tags-deploy');
                    container.innerHTML = data.tags.map(t => 
                        `<div><input type="checkbox" value="${t.name}"> ${t.name}</div>`
                    ).join('');
                    document.getElementById('deploy-btn').disabled = false;
                }
            } catch(e) { console.error(e); }
        }
        
        async function startDeployment() {
            if(!selectedDeployProject) return;
            const tags = Array.from(document.querySelectorAll('#tags-deploy input:checked')).map(c=>c.value);
            
            try {
                // CHANGED: Correct URL to include project ID
                const res = await fetch(`/api/projects/${selectedDeployProject}/deploy`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ tags })
                });
                const data = await res.json();
                if(data.success) monitorTask(data.task_id, 'deploy');
            } catch(e) { console.error(e); }
        }
        
        async function createTagAndDeploy() {
            const pids = getSelected('full-project');
            if(pids.length !== 1) return showToast('Error', 'Select exactly 1 project', 'error');
            const pid = pids[0];
            
            // For now hardcode dev tag or fetch available envs logic
            try {
                const res = await fetch(`/api/projects/${pid}/deploy`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ tags: ['dev'] }) // Logic simplifies to deploying 'dev'
                });
                const data = await res.json();
                if(data.success) monitorTask(data.task_id, 'full');
            } catch(e) { console.error(e); }
        }
        
        function monitorTask(taskId, panelId) {
            const logsDiv = document.getElementById(`${panelId}-logs`);
            logsDiv.style.display = 'block';
            logsDiv.innerHTML = '<div>Starting task...</div>';
            
            const poll = setInterval(async () => {
                try {
                    const res = await fetch(`/api/tasks/${taskId}`);
                    const data = await res.json();
                    if(data.success) {
                        logsDiv.innerHTML = data.task.logs.map(l => 
                            `<div class="log-entry log-${l.level.toLowerCase()}">[${l.level}] ${l.message}</div>`
                        ).join('');
                        logsDiv.scrollTop = logsDiv.scrollHeight;
                        
                        if(data.task.status === 'completed' || data.task.status === 'failed') {
                            clearInterval(poll);
                        }
                    }
                } catch(e) { clearInterval(poll); }
            }, 2000);
        }
        
        function showToast(title, msg, type) {
            const t = document.createElement('div');
            t.className = `toast show`;
            t.style.backgroundColor = type==='error'?'#d32f2f':type==='warning'?'#f57c00':'#388e3c';
            t.innerText = `${title}: ${msg}`;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
        
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        
        function closeDiffModal() { document.getElementById('diff-modal').classList.remove('show'); }
    </script>
</body>
</html>
